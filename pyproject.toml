[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "field-audio-tools"
version = "0.1.0"
description = "Small, local-first tools for citing, screening, and identifying field recordings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Mountaineering Acoustics Network" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26",
]

[project.scripts]
soundcite = "field_audio_tools.soundcite:main"
lowdom = "field_audio_tools.lowdom:main"
birdidpv = "field_audio_tools.birdidpv:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
]
# birdidpv only. These pull in TensorFlow, so they stay out of the core install.
birdnet = [
  "birdnetlib>=0.18",
  "tensorflow-cpu>=2.16",
  "librosa>=0.10",
  "resampy>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/field_audio_tools"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
